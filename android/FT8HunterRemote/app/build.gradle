plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iu2jmz.ft8hunterremote'
    compileSdk 35

    defaultConfig {
        applicationId "com.iu2jmz.ft8hunterremote"
        minSdk 26
        targetSdk 35
        versionCode 2022003
        versionName "2.2.3"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
