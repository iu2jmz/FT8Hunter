name: Build FT8 Hunter v1 (WSJT-X)

on:
  push:
    branches: [ wsjtx-v1-log4om ]
    paths:
      - "wsjtx-hunter/**"
      - ".github/workflows/build-wsjtx-hunter-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUNTER_VERSION: "1.0.2"
  WSJTX_UPSTREAM_SHA: "967c85a6119110788b0df3782cf796485b2cee14"
  HAMLIB_BRANCH: "4.7.0"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Disable CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout FT8 Hunter control repo
        uses: actions/checkout@v4
        with:
          ref: wsjtx-v1-log4om

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            git make tar zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-websockets
            mingw-w64-x86_64-qt5-activeqt
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-libmariadbclient
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-ruby
            autoconf automake libtool

      - name: Install asciidoctor
        run: gem install asciidoctor --no-document

      - name: Fetch pinned official WSJT-X source
        run: |
          git clone https://github.com/WSJTX/wsjtx.git wsjtx-src
          cd wsjtx-src
          git checkout "$WSJTX_UPSTREAM_SHA"
          echo "Using WSJT-X $(git rev-parse HEAD)"

      - name: Apply FT8 Hunter v1 patch
        shell: pwsh
        run: ./wsjtx-hunter/patch-ft8hunter.ps1 -SourceDir "./wsjtx-src" -HunterVersion "$env:HUNTER_VERSION"

      - name: Cache Hamlib
        id: hamlib-cache
        uses: actions/cache@v4
        with:
          path: hamlib-prefix
          key: hamlib-windows-${{ env.HAMLIB_BRANCH }}-mingw64-v1

      - name: Build Hamlib only on cache miss
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          git clone --depth 1 --branch "$HAMLIB_BRANCH" https://github.com/Hamlib/Hamlib.git hamlib-src
          cd hamlib-src
          ./bootstrap
          ./configure --prefix="${WORKSPACE}/hamlib-prefix" --enable-shared --disable-static --without-cxx-binding --without-readline CFLAGS="-DNDEBUG -O2 -fdata-sections -ffunction-sections" LDFLAGS="-Wl,--gc-sections"
          make -j$(nproc)
          make install-strip

      - name: Download and install OmniRig for WSJT-X build support
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Invoke-WebRequest -Uri "https://www.dxatlas.com/OmniRig/Files/OmniRig.zip" -OutFile "vendor/OmniRig.zip"
          Expand-Archive -Path "vendor/OmniRig.zip" -DestinationPath "vendor/OmniRig" -Force
          $setup = Get-ChildItem -Path "vendor/OmniRig" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) { throw "OmniRig installer non trovato" }
          Copy-Item $setup.FullName "vendor/OmniRigSetup.exe" -Force
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT","/NORESTART" -Wait
          $omnirig = Get-ChildItem -Path "C:\Program Files*\Afreet\OmniRig" -Filter "OmniRig.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $omnirig) { throw "OmniRig install build-time fallita" }
          echo "OMNIRIG_PATH=$($omnirig.FullName)" >> $env:GITHUB_ENV

      - name: Fix dumpcpp executable name
        run: ln -sf /mingw64/bin/dumpcpp-qt5.exe /mingw64/bin/dumpcpp.exe

      - name: Configure WSJT-X engine
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          OMNIRIG=$(cygpath "${OMNIRIG_PATH}")
          cmake -G "MSYS Makefiles" -S wsjtx-src -B wsjtx-build \
            -DCMAKE_PREFIX_PATH="${WORKSPACE}/hamlib-prefix" \
            -DOMNIRIG_TYPE_LIB="${OMNIRIG}" \
            -DCMAKE_Fortran_FLAGS="-fallow-argument-mismatch -std=legacy" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DWSJT_SKIP_MANPAGES=ON \
            -DWSJT_BUILD_TESTS=OFF \
            -DWSJT_RELEASE_CHANNEL=GA \
            -Wno-dev

      - name: Build FT8 Hunter WSJT-X base
        run: cmake --build wsjtx-build -j$(nproc)

      - name: Stage runtime
        run: |
          WORKSPACE=$(cygpath "${GITHUB_WORKSPACE}")
          cmake --install wsjtx-build --prefix "${WORKSPACE}/stage-main"
          test -f "${WORKSPACE}/stage-main/bin/wsjtx.exe"
          cp wsjtx-src/COPYING "${WORKSPACE}/stage-main/COPYING-WSJTX-GPLv3.txt"
          cp wsjtx-hunter/README.md "${WORKSPACE}/stage-main/FT8HUNTER-README.md"
          mkdir -p "${WORKSPACE}/stage-main/bin/sqldrivers"
          cp /mingw64/share/qt5/plugins/sqldrivers/qsqlmysql.dll "${WORKSPACE}/stage-main/bin/sqldrivers/"
          cp /mingw64/bin/libmariadb.dll "${WORKSPACE}/stage-main/bin/"

          # qsqlmysql.dll can be discovered by Qt even when one of its native
          # dependencies is missing. Copy the complete MinGW dependency closure
          # of both the Qt SQL plugin and libmariadb so the driver can actually load.
          copy_mingw_deps() {
            local target="$1"
            echo "Dependency scan: $target"
            ldd "$target" || true
            ldd "$target" 2>/dev/null | awk '
              {
                for (i=1; i<=NF; ++i) {
                  if ($i ~ /^\\/mingw64\\/bin\\/.*\\.dll$/) print $i
                }
              }' | sort -u | while read -r dep; do
                if [ -f "$dep" ]; then
                  cp -f "$dep" "${WORKSPACE}/stage-main/bin/"
                fi
              done
          }

          copy_mingw_deps /mingw64/share/qt5/plugins/sqldrivers/qsqlmysql.dll
          copy_mingw_deps /mingw64/bin/libmariadb.dll

          # One additional pass covers dependencies of libraries pulled in above.
          find "${WORKSPACE}/stage-main/bin" -maxdepth 1 -type f -iname '*.dll' -print0 |
            while IFS= read -r -d '' dll; do
              copy_mingw_deps "$dll"
            done

          test -f "${WORKSPACE}/stage-main/bin/sqldrivers/qsqlmysql.dll"
          test -f "${WORKSPACE}/stage-main/bin/libmariadb.dll"
          ls -la "${WORKSPACE}/stage-main/bin"
          ls -la "${WORKSPACE}/stage-main/bin/sqldrivers"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build self-installing FT8 Hunter setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe non trovato" }
          & $iscc "/DStageDir=$env:GITHUB_WORKSPACE\stage-main" "/DOmniRigSetup=$env:GITHUB_WORKSPACE\vendor\OmniRigSetup.exe" "wsjtx-hunter\installer\FT8Hunter.iss"
          $setup = "$env:GITHUB_WORKSPACE\installer-output-wsjtx\FT8Hunter_Setup_v1.0.2.exe"
          if (-not (Test-Path $setup)) { throw "FT8Hunter_Setup_v1.0.2.exe non generato" }
          Get-Item $setup | Format-List Name,Length,LastWriteTime

      - name: Package corresponding source
        run: |
          tar -czf FT8Hunter_v1.0.2_source.tar.gz wsjtx-src wsjtx-hunter
          ls -lh FT8Hunter_v1.0.2_source.tar.gz

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FT8Hunter_Setup_v1.0.2
          path: installer-output-wsjtx/FT8Hunter_Setup_v1.0.2.exe
          if-no-files-found: error

      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: FT8Hunter_v1.0.2_source
          path: FT8Hunter_v1.0.2_source.tar.gz
          if-no-files-found: error
