name: Build Windows Test EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout FT8Hunter
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Checkout HamDigiSharp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ThirdParty | Out-Null
          git clone --depth 1 https://github.com/HegrJan/HamDigiSharp.git ThirdParty/HamDigiSharp

      - name: Apply targeted FT8 realtime tuning
        shell: pwsh
        run: ./build/patch-hamdigisharp-ft8.ps1

      - name: Apply IC-7300 USB-D patch
        shell: pwsh
        run: ./build/patch-ic7300-usbd.ps1

      - name: Restore
        run: dotnet restore src/FT8Hunter.CoreTest/FT8Hunter.CoreTest.csproj

      - name: Publish self-contained single EXE
        shell: pwsh
        run: |
          dotnet publish src/FT8Hunter.CoreTest/FT8Hunter.CoreTest.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish/win-x64

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path publish/win-x64/FT8Hunter_Test.exe)) { throw 'FT8Hunter_Test.exe non generato' }
          Get-Item publish/win-x64/FT8Hunter_Test.exe | Format-List Name,Length,LastWriteTime

      - name: Download official OmniRig package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Invoke-WebRequest -Uri 'https://www.dxatlas.com/OmniRig/Files/OmniRig.zip' -OutFile 'vendor/OmniRig.zip'
          Expand-Archive -Path 'vendor/OmniRig.zip' -DestinationPath 'vendor/OmniRig' -Force
          $setup = Get-ChildItem -Path 'vendor/OmniRig' -Filter 'OmniRigSetup.exe' -Recurse | Select-Object -First 1
          if (-not $setup) { throw 'OmniRigSetup.exe non trovato nel pacchetto ufficiale' }
          Copy-Item $setup.FullName 'vendor/OmniRigSetup.exe' -Force
          Get-Item 'vendor/OmniRigSetup.exe' | Format-List Name,Length,LastWriteTime

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build self-installing Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe non trovato' }
          & $iscc installer/FT8Hunter.iss
          if (-not (Test-Path installer-output/FT8Hunter_Setup_v0.6.8.exe)) { throw 'FT8Hunter_Setup_v0.6.8.exe non generato' }
          Get-Item installer-output/FT8Hunter_Setup_v0.6.8.exe | Format-List Name,Length,LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FT8Hunter_Test_win-x64
          path: publish/win-x64/FT8Hunter_Test.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FT8Hunter_Setup_v0.6.8
          path: installer-output/FT8Hunter_Setup_v0.6.8.exe
          if-no-files-found: error
